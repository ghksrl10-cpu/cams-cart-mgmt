<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대차 관리 시스템 | 캠스</title>
<style>
:root{
  --bd:#2a2d35;--line:#23262f;--hd:#1a1d24;--hd2:#20232b;
  --blue:#3b82f6;--blue2:#2563eb;
  --ok:#22c55e;--okbg:#052e16;--ng:#ef4444;--ngbg:#2d0a0a;
  --warn:#f59e0b;--warnbg:#1c1a05;
  --mut:#9ca3af;--ink:#f1f5f9;
  --side:#13151c;--bg:#0f1117;
}
*{box-sizing:border-box}
body{margin:0;font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
a{color:inherit}

/* ===== 레이아웃 ===== */
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--side);border-right:1px solid var(--bd);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line)}
.brand .logo{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.brand b{font-size:15px}.brand small{display:block;color:var(--mut);font-size:12px;margin-top:1px}
.nav{padding:10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:9px;cursor:pointer;color:#94a3b8;font-weight:600;font-size:15px;margin-bottom:3px;transition:background .15s}
.nav-item:hover{background:#20232b}
.nav-item.active{background:var(--blue);color:#fff}
.nav-item .ic{width:22px;text-align:center;font-size:17px}
.side-foot{padding:14px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}

.main{flex:1;margin-left:230px;padding:20px 24px 70px;max-width:1400px}
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.page-h h1{font-size:22px;margin:0}
.grow{flex:1}

/* ===== 버튼 ===== */
.btn{padding:9px 14px;border:1px solid var(--bd);border-radius:9px;background:#20232b;cursor:pointer;font-size:14px;font-weight:600;color:#e2e8f0;transition:background .15s}
.btn:hover{background:#2a2d35}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.pri:hover{background:var(--blue2)}
.btn.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.btn.danger{background:var(--ngbg);color:var(--ng);border-color:var(--ng)}
.btn.sm{padding:5px 10px;font-size:12px}

/* ===== 카드 ===== */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.card{background:#1a1d24;border:1px solid var(--bd);border-radius:14px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--blue)}
.card .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:10px}
.card .num{font-size:30px;font-weight:800;line-height:1}.card .lab{color:var(--mut);font-size:13px;margin-top:6px}
.ic.b{background:#dbeafe;color:#2563eb}.ic.g{background:var(--okbg);color:var(--ok)}
.ic.r{background:var(--ngbg);color:var(--ng)}.ic.y{background:#fef3c7;color:#b45309}

/* ===== 테이블 ===== */
.tbl-wrap{background:#1a1d24;border:1px solid var(--bd);border-radius:12px;overflow:hidden;overflow-x:auto}
.tbl-wrap table{border-collapse:collapse;width:100%;min-width:560px}
.tbl-wrap th{background:var(--hd);padding:11px 13px;text-align:left;font-weight:700;font-size:13px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl-wrap td{padding:10px 13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl-wrap tr:last-child td{border-bottom:0}
.tbl-wrap tr:hover td{background:#1e2533}

/* ===== 폼 ===== */
.form-card{background:#1a1d24;border:1px solid var(--bd);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.form-card h3{margin:0 0 14px;font-size:15px;font-weight:800}
.frow{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.frow:last-child{margin-bottom:0}
.fg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px}
.fg label{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font-size:14px;background:#0f1117;color:#f1f5f9;font-family:inherit;transition:border-color .15s}
.fg textarea{resize:vertical;min-height:72px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--blue)}

/* ===== 점검 항목 ===== */
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.check-item{background:var(--hd2);border:2px solid var(--bd);border-radius:10px;padding:13px 14px;transition:border-color .2s,background .2s}
.check-item .ci-label{font-weight:700;font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.check-item select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;font-size:14px;background:#0f1117;color:#f1f5f9}
.check-item.ok-item{border-color:var(--ok);background:var(--okbg)}
.check-item.ng-item{border-color:var(--ng);background:var(--ngbg)}

/* ===== 배지 ===== */
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.badge.st-ok{background:var(--okbg);color:var(--ok)}
.badge.st-ng{background:var(--ngbg);color:var(--ng)}
.badge.st-warn{background:var(--warnbg);color:var(--warn)}
.badge.st-blue{background:#dbeafe;color:var(--blue2)}
.badge.st-mut{background:#1e2533;color:var(--mut)}

/* ===== 사진 ===== */
.photo-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.ph{position:relative}
.ph img{width:100px;height:75px;object-fit:cover;border:1px solid var(--bd);border-radius:7px;cursor:pointer;display:block}
.ph .del{position:absolute;top:-7px;right:-7px;background:#fff;border:1px solid #ccc;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:700;color:var(--ng);font-size:13px;display:flex;align-items:center;justify-content:center;line-height:1}
.ph-save{position:absolute;bottom:-7px;right:-7px;background:#1e3a5f;border:1px solid var(--blue);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;text-decoration:none;line-height:1}

/* ===== 활동 목록 ===== */
.act-list{display:flex;flex-direction:column;gap:6px}
.act-item{display:flex;align-items:flex-start;gap:10px;background:#1a1d24;border:1px solid var(--bd);border-radius:9px;padding:11px 13px}
.act-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
.act-dot.insp{background:var(--blue)}.act-dot.move{background:var(--ok)}.act-dot.issue{background:var(--ng)}
.act-txt{font-size:13px;line-height:1.4}.act-time{font-size:12px;color:var(--mut);margin-top:2px}

/* ===== 검색창 ===== */
.search-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search-bar input{flex:1;padding:9px 12px;border:1px solid var(--bd);border-radius:9px;font-size:14px;background:#1a1d24;color:#f1f5f9}
.search-bar input:focus{outline:none;border-color:var(--blue)}

/* ===== 탭 ===== */
.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:9px 18px;border:1px solid var(--bd);background:#1a1d24;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;color:#cbd5e1;transition:background .15s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ===== 빈 상태 ===== */
.empty{text-align:center;padding:48px 20px;color:var(--mut);font-size:14px}
/* ===== 붙여넣기 존 ===== */
.paste-zone{min-height:44px;border:2px dashed var(--bd);border-radius:8px;padding:8px;margin-top:8px;transition:border-color .2s}
.paste-zone:hover{border-color:var(--blue)}
/* ===== 대차 그룹 헤더 ===== */
.cart-grp-hd{padding:6px 10px 4px;font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;border-top:1px solid var(--bd);margin-top:4px}
.cart-grp-hd:first-child{margin-top:0;border-top:0}

/* ===== 오버레이 ===== */
#overlay{position:fixed;inset:0;background:rgba(10,12,18,.97);display:none;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:700;color:#f1f5f9;z-index:80;padding:20px;line-height:1.8}

/* ===== 모달 ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#1a1d24;border:1px solid var(--bd);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#1a1d24;z-index:1}
.modal-h h3{margin:0;font-size:16px}
.modal-body{padding:20px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#1a1d24}

/* ===== 2열 그리드 ===== */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ===== 모바일 ===== */
.hamb{display:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
.scrim.show{display:block}
@media(max-width:820px){
  .side{transform:translateX(-100%);transition:.25s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  .side.open{transform:translateX(0)}
  .main{margin-left:0;padding:14px 14px 70px}
  .hamb{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--bd);border-radius:9px;background:#1a1d24;font-size:20px;cursor:pointer}
  .cards{grid-template-columns:repeat(2,1fr)}
  .check-grid{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
}
@media print{
  .side,.hamb,.btn,#overlay{display:none!important}
  .main{margin:0;padding:10px}
}
</style>
</head>

<script>
/* ===================================================================
   Firebase 설정 — Firebase 콘솔에서 복사해 아래에 붙여넣기
   =================================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyCLvsQvj7kYmDOVJzU6RfiPPnAom8C-Nt0",
  authDomain:        "cams-cart-mgmt.firebaseapp.com",

  storageBucket:     "cams-cart-mgmt.firebasestorage.app",
  messagingSenderId: "184214532683",
  appId:             "1:184214532683:web:05060772f39427d80713ce"
};
/* =================================================================== */

let db = null;
let _charts = {};

/* ===== Teams 웹훅 ===== */
const TEAMS_WEBHOOKS=[
  'https://defaultc0cb4e4b345c43eb859beb9397bfbb.de.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/1d97dd3558f045918982422dc3037a3f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=f6zDMVg3T8LXgTps_koN43AlMp1HNUF5eAfpiOmujBc',
  'https://defaultc0cb4e4b345c43eb859beb9397bfbb.de.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c30d80af8a5b4cb6ae171359b5267d45/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UoRyUjscu8OdC8wCBgzs6aGxUIhQd_Kuk-FSAiiiVP8',
  'https://defaultc0cb4e4b345c43eb859beb9397bfbb.de.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/bc16c8ef31fb4a10a7084e40c0568949/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=XVIQaRrsegpqDX9X8QaAvZJzPAzBsRh6_ZY78aDFv-g',
  'https://defaultc0cb4e4b345c43eb859beb9397bfbb.de.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/15266d403c254445b0b58bfca408103f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Ju6unRhZebCPnNSYwj2F81vWy__FVys3ApCM7sbD6KU'
];
async function sendTeamsAlert(cartIds, date, memo){
  try{
    const list=Array.isArray(cartIds)?cartIds:[cartIds];
    const payload={
      type:'message',
      attachments:[{
        contentType:'application/vnd.microsoft.card.adaptive',
        content:{
          $schema:'http://adaptivecards.io/schemas/adaptive-card.json',
          type:'AdaptiveCard',

          body:[

            {type:'FactSet',facts:[

    ]);
  } catch(e){ console.warn('Teams 알람 오류:',e); }
}

/* ===== 메모리 상태 ===== */
let CARTS = {};       // cartId → {id, name, location, status, memo, ...}
let INSPECTIONS = []; // [{id, cartId, date, inspector, checks, result, memo, photos}]
let MOVEMENTS  = [];  // [{id, cartId, date, type, from, to, qty, who, memo}]

const STATUS_CLS = {'정상운용':'st-ok','점검대기':'st-warn','수리중':'st-ng','폐기대기':'st-mut'};

/* ===== Firebase 초기화 ===== */
function fbInit(){
  if(firebaseConfig.apiKey.startsWith('여기에')){
    showOverlay('⚠️ Firebase 설정이 비어 있습니다.<br>index.html 의 firebaseConfig 를 채워주세요.<br><small style="font-size:14px;font-weight:400">설치방법.txt 를 참고하세요</small>');
    return false;
  }
  // Firebase SDK가 없어도 REST API로 읽기 가능 → 앱은 항상 표시
  if(typeof firebase==='undefined'){
    console.warn('Firebase SDK 미로드 — 읽기는 REST API, 쓰기는 불가');
    return true;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
    try{ db.settings({experimentalForceLongPolling:true}); }catch(e2){}
    return true;
  }
  catch(e){
    console.error('Firebase SDK 초기화 오류:', e);
    return true; // 오류 있어도 REST API로 읽기 계속
  }
}
function showOverlay(html){ const o=document.getElementById('overlay'); o.innerHTML=html; o.style.display='flex'; }
function hideOverlay(){ document.getElementById('overlay').style.display='none'; }
function setSyncStatus(msg){ document.getElementById('syncStatus').textContent=msg; }

/* ===== Firestore REST API 헬퍼 (읽기 전용) ===== */
const _FS='https://firestore.googleapis.com/v1/projects/cams-cart-mgmt/databases/(default)';
function _fsVal(v){
  if(!v) return null;
  if(v.stringValue!==undefined) return v.stringValue;
  if(v.integerValue!==undefined) return Number(v.integerValue);
  if(v.doubleValue!==undefined) return v.doubleValue;
  if(v.booleanValue!==undefined) return v.booleanValue;
  if(v.timestampValue!==undefined) return v.timestampValue;
  if(v.nullValue!==undefined) return null;
  if(v.arrayValue!==undefined) return (v.arrayValue.values||[]).map(x=>_fsVal(x));
  if(v.mapValue!==undefined) return _fsFields(v.mapValue.fields);
  return null;
}
function _fsFields(f){ if(!f) return {}; return Object.fromEntries(Object.entries(f).map(([k,v])=>[k,_fsVal(v)])); }
function _fsDoc(d){ return {id:d.name.split('/').pop(),..._fsFields(d.fields)}; }
async function _fsGetAll(col){
  const r=await fetch(`${_FS}/documents/${col}?pageSize=500`);
  const d=await r.json();
  if(d.error) throw new Error(d.error.message);
  return (d.documents||[]).map(_fsDoc);
}
async function _fsQuery(col,orderField,lim=300){
  const r=await fetch(`${_FS}/documents:runQuery`,{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({structuredQuery:{
      from:[{collectionId:col}],
      orderBy:[{field:{fieldPath:orderField},direction:'DESCENDING'}],
      limit:lim
    }})
  });
  const d=await r.json();
  if(!Array.isArray(d)) throw new Error('쿼리 오류: '+JSON.stringify(d).slice(0,80));
  return d.filter(x=>x.document).map(x=>_fsDoc(x.document));
}

/* ===== 전체 로드 (REST API 사용) ===== */
async function loadAll(){
  const _timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error(
    'Firestore 연결 시간 초과 (15초)<br><small style="font-weight:400;font-size:14px">네트워크를 확인하고 새로고침 해주세요</small>'
  )),15000));
  const [cArr,iArr,mArr]=await Promise.race([
    Promise.all([_fsGetAll('carts'),_fsQuery('inspections','createdAt'),_fsQuery('movements','createdAt')]),
    _timeout
  ]);
  CARTS={};
  cArr.forEach(d=>{ CARTS[d.id]={...d,_docId:d.id}; });
  INSPECTIONS=iArr;
  MOVEMENTS=mArr;
}

/* ===== 사진 압축 ===== */
function compressImage(file,maxDim,q){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>=h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
        else if(h>w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',q));
      };
      img.onerror=rej; img.src=r.result;
    };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

  curPage=page;

async function saveCart(id){
  const newId=document.getElementById('cm_id').value.trim();
  if(!newId){ alert('관리번호를 입력하세요'); return; }
  const data={
    id:newId,
    name:document.getElementById('cm_name').value.trim(),
    location:document.getElementById('cm_loc').value,
    status:document.getElementById('cm_status').value,
    memo:document.getElementById('cm_memo').value.trim(),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  if(!id) data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
  try{
    await db.collection('carts').doc(newId).set(data,{merge:true});
    CARTS[newId]={...(CARTS[newId]||{}), ...data, _docId:newId};
    closeModal('cartModal'); setSyncStatus('저장됨 ✅'); renderCarts();
  } catch(e){ alert('저장 오류: '+e.message); }
}

async function deleteCart(id){
  if(!confirm(`대차 [${id}] 를 삭제하시겠습니까?\n(점검·입출고·이슈 기록은 남습니다)`)) return;
  try{
    await db.collection('carts').doc(id).delete();
    delete CARTS[id]; setSyncStatus('삭제됨'); renderCarts();
  } catch(e){ alert('삭제 오류: '+e.message); }
}

/* 대차 검색 필터
   - 숫자만 입력 → 그 번호 대차만 (예: "5" → 1FRT-5, 1RR-5, 2FRT-5 …)
   - 텍스트 입력 → ID·이름 포함 검색 (예: "1FRT", "1라인", "CPAD")
*/
function filterCartChk(q){
  const rows=document.querySelectorAll('#cartChkList .cart-chk-row');
  const lq=(q||'').trim().toLowerCase();
  const isNum=/^\d+$/.test(lq);
  rows.forEach(r=>{
    let show=false;
    if(!lq){
      show=true;
    } else if(isNum){
      const numPart=r.dataset.id.split('-').pop();
      show=(parseInt(numPart,10)===parseInt(lq,10));
    } else {
      show=r.dataset.id.toLowerCase().includes(lq)||r.dataset.name.includes(lq);
    }
    r.style.display=show?'':'none';
  });
}
/* 전체 선택/해제 */
function selectAllCartChk(sel){
  const rows=document.querySelectorAll('#cartChkList .cart-chk-row');
  rows.forEach(r=>{
    if(r.style.display==='none') return;
    const cb=r.querySelector('input');
    cb.checked=sel;
    r.classList.toggle('selected',sel);
  });
  updateSelCount();
}
/* 그룹 선택 */
function selectGroup(idx){
  const g=BTN_GROUPS[idx]; if(!g) return;
  const rows=document.querySelectorAll('#cartChkList .cart-chk-row');
  const groupRows=[...rows].filter(r=>g.match(r.dataset.id));
  // 전부 선택돼 있으면 해제, 아니면 추가 선택 (기존 선택 유지)
  const allChecked=groupRows.every(r=>r.querySelector('input').checked);
  groupRows.forEach(r=>{
    const cb=r.querySelector('input');
    cb.checked=!allChecked;
    r.classList.toggle('selected',!allChecked);
  });
  updateSelCount();
}
/* 선택 카운트 */
function updateSelCount(){
  const n=document.querySelectorAll('#cartChkList .cart-chk:checked').length;
  const el=document.getElementById('selCount');
  if(el) el.textContent=n+'대 선택';
  document.querySelectorAll('#cartChkList .cart-chk-row').forEach(r=>{
    r.classList.toggle('selected',r.querySelector('input').checked);
  });
}

function onCheckChange(key,val,okVal){
  const el=document.getElementById('ci_'+key); if(!el) return;
  el.classList.toggle('ok-item',val===okVal);
  el.classList.toggle('ng-item',val!==okVal);
}
function onReplaceChange(checked){
  const el=document.getElementById('ci_replace');
  const lbl=document.getElementById('chk_replace_lbl');
  if(el){ el.style.borderColor=checked?'var(--blue)':'var(--bd)'; el.style.background=checked?'#0d1f3c':''; }
  if(lbl){ lbl.textContent=checked?'완료':'미완료'; lbl.style.color=checked?'var(--blue)':'var(--mut)'; }
  // 하나 누르면 둘 다 체크
  if(checked){
    const doneChk=document.getElementById('chk_done');
    if(doneChk&&!doneChk.checked){ doneChk.checked=true; onDoneChange(true); }
  }
}
function onDoneChange(checked){
  const wrap=document.getElementById('ci_done_wrap');
  const lbl=document.getElementById('chk_done_lbl');
  if(wrap){ wrap.style.borderColor=checked?'var(--ok)':'var(--bd)'; wrap.style.background=checked?'var(--okbg)':''; }
  if(lbl){ lbl.textContent=checked?'— 완료':'— 미완료'; lbl.style.color=checked?'var(--ok)':'var(--mut)'; }
  // 하나 누르면 둘 다 체크
  if(checked){
    const replChk=document.getElementById('chk_replace');
    if(replChk&&!replChk.checked){ replChk.checked=true; onReplaceChange(true); }
  }
}

let followUpPhotos=[];
let followUpModalActive=false;
function addPhotos(input,type){
  const arr=(type==='followUp'?followUpPhotos:inspPhotos);
  const listId=(type==='followUp'?'fu_photoList':'insp_photoList');
  Array.from(input.files).forEach(async f=>{
    if(arr.length>=5){ alert('사진은 최대 5장까지 첨부 가능합니다'); return; }
    const url=await compressImage(f,1024,0.55);

function saveToAlbum(url, name){
  try{
    const fname = name || ('cams_'+new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')+'.jpg');
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>document.body.removeChild(a), 1000);
  } catch(e){}
}
function refreshPhotoList(listId,arr,type){
  const el=document.getElementById(listId); if(!el) return;
  const arrName=(type==='followUp'?'followUpPhotos':'inspPhotos');
  el.innerHTML=arr.map((p,i)=>`<div class="ph">
    <img src="${p.url}" onclick="viewImg('${p.url}')">
    <button class="del" onclick="${arrName}.splice(${i},1);refreshPhotoList('${listId}',${arrName},'${type}')">✕</button>
    <a class="ph-save" href="${p.url}" download="${p.name||'photo.jpg'}" title="기기에 저장">💾</a>

document.addEventListener('paste', async e=>{
  // ① 파일을 동기적으로 먼저 추출 (await 이후엔 clipboardData 소멸)
  const files=[...e.clipboardData.items]
    .filter(i=>i.type.startsWith('image/'))
    .map(i=>i.getAsFile())
    .filter(Boolean);
  if(!files.length) return;
  e.preventDefault(); // 텍스트 붙여넣기 방지
  // ② 현재 활성 폼 판단 (curPage + tab 변수로 안정적으로 체크)
  const type=(curPage==='insp'&&inspTab==='form')?'insp':
             followUpModalActive?'followUp':null;
  if(!type) return;
  const arr=type==='insp'?inspPhotos:issuePhotos;
  const listId=type==='insp'?'insp_photoList':'issue_photoList';
  for(const file of files){
    if(arr.length>=5){ alert('사진은 최대 5장까지 첨부 가능합니다'); break; }
    const url=await compressImage(file,1024,0.55);
    arr.push({url,name:'붙여넣기_'+(arr.length+1)+'.jpg'});
    refreshPhotoList(listId,arr,type);
  }
});

/* ===== 드래그&드롭 ===== */
async function dropPhoto(e, type){
  e.preventDefault();
  const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));
  const arr=type==='followUp'?followUpPhotos:inspPhotos;
  const listId=type==='followUp'?'fu_photoList':'insp_photoList';
  for(const file of files){
    if(arr.length>=5){ alert('사진은 최대 5장까지 첨부 가능합니다'); break; }
    const url=await compressImage(file,1024,0.55);
    arr.push({url,name:file.name});
    refreshPhotoList(listId,arr,type);
  }
}

async function saveInsp(){
  const date=val('insp_date');
  if(!date){ alert('점검일을 입력하세요'); return; }
  const selected=[...document.querySelectorAll('#cartChkList .cart-chk:checked')].map(c=>c.value);
  if(selected.length===0){ alert('대차를 하나 이상 선택하세요'); return; }
  const checks={
    wheels:   selVal('ci_wheels'),
    frame:    selVal('ci_frame'),
    shoba:    selVal('ci_shoba'),
    fixtures: selVal('ci_fixtures'),
    clean:    selVal('ci_clean'),
  };
  const done=document.getElementById('chk_done')?.checked||false;
  const replaced=document.getElementById('chk_replace')?.checked||false;
  const allNormal=(checks.wheels==='정상'&&checks.frame==='정상'&&checks.shoba==='정상'&&checks.fixtures==='정상'&&checks.clean==='청결');
  // 이상 있어도 교체완료+점검완료 체크 시 OK 처리
  const result=(allNormal||(done&&replaced))?'OK':'NG';
  const inspector=val('insp_who');
  const memo=val('insp_memo');
  const ts=firebase.firestore.FieldValue.serverTimestamp();
  showOverlay(`점검 저장 중… (0 / ${selected.length})`);
  try{
    let batch=db.batch(); let cnt=0; let saved=0;
    const ns=result==='OK'?'정상운용':'점검대기';
    // 미리 doc 참조 생성 (ID를 메모리에도 저장하기 위해)
    const docRefs=selected.map(()=>db.collection('inspections').doc());
    for(let si=0;si<selected.length;si++){
      const cartId=selected[si];
      const ref=docRefs[si];
      batch.set(ref,{cartId,date,inspector,checks,result,done,replaced,memo,photos:inspPhotos,createdAt:ts});
      batch.update(db.collection('carts').doc(cartId),{status:ns,updatedAt:ts});
      cnt+=2;
      if(cnt>=498){ await batch.commit(); saved+=cnt/2; batch=db.batch(); cnt=0; showOverlay(`점검 저장 중… (${saved} / ${selected.length})`); }
    }
    if(cnt>0) await batch.commit();
    // 메모리 반영 (실제 Firestore ID 사용)
    for(let si=0;si<selected.length;si++){
      const cartId=selected[si];
      const d={id:docRefs[si].id,cartId,date,inspector,checks,done,replaced,result,memo,photos:[...inspPhotos]};
      INSPECTIONS.unshift(d);
      if(CARTS[cartId]) CARTS[cartId].status=ns;
    }
    // ── 프레임 이상 → 입출고 자동 등록 ──────────────
    let autoMoveCount=0;
    if(checks.frame==='이상있음'){
      const moveBatch=db.batch();
      for(const cartId of selected){
        const mRef=db.collection('movements').doc();
        const mData={cartId,date,type:'반출 대기(사내)',from:'',to:'인텍',qty:1,who:'오명진 팀장',memo,createdAt:ts};
        moveBatch.set(mRef,mData);
        MOVEMENTS.unshift({id:mRef.id,...mData});
        autoMoveCount++;
      }
      await moveBatch.commit();
    }
    inspPhotos=[]; hideOverlay(); setSyncStatus('저장됨 ✅');
    if(autoMoveCount>0) sendTeamsAlert(selected, date, memo);
    const autoMsg=autoMoveCount>0?`\n🔩 프레임 이상 → 입출고 ${autoMoveCount}건 자동 등록됨 (반출 대기(사내) · 인텍)`:'';
    alert(`점검 저장 완료!\n${selected.length}대 · 결과: ${result}${autoMsg}`);
    renderInsp();
    if(curPage==='dash') renderDash();
  } catch(e){ hideOverlay(); alert('저장 오류: '+e.message); }
}

    <button class="btn${histNgOnly?' danger':''}" onclick="histNgOnly=!histNgOnly;renderInsp()" style="${histNgOnly?'':''}">

    <thead><tr><th>날짜</th><th>대차</th><th>점검자</th><th>바퀴</th><th>프레임</th><th>쇼바</th><th>적재장치</th><th>청소</th><th>결과</th><th>점검완료</th><th>교체완료</th><th>메모</th><th>사진</th><th>조작</th></tr></thead>

function chkBadge(v,ok){ return `<span class="badge ${v===ok?'st-ok':'st-ng'}">${v||'—'}</span>`; }

async function autoRegFrameMoves(){
  // 프레임 이상 점검 이력 전체
  const frameNG=INSPECTIONS.filter(r=>r.checks?.frame==='이상있음');
  if(frameNG.length===0){ alert('프레임 이상 점검 이력이 없습니다.'); return; }
  // 이미 입출고 등록된 항목 (같은 대차+날짜+유형)
  const existing=new Set(
    MOVEMENTS.filter(m=>m.type==='반출 대기(사내)').map(m=>`${m.cartId}__${m.date}`)
  );
  const toAdd=frameNG.filter(r=>!existing.has(`${r.cartId}__${r.date}`));
  if(toAdd.length===0){ alert('프레임 이상 이력 '+frameNG.length+'건이 모두 이미 입출고 등록되어 있습니다.'); return; }
  const ok=confirm(
    `프레임 이상 ${frameNG.length}건 중 미등록 ${toAdd.length}건을 입출고 자동 등록하시겠습니까?\n\n`+
    `유형: 반출 대기(사내)\n도착지: 인텍\n담당자: 오명진 팀장\n메모: 점검 메모 그대로`
  );
  if(!ok) return;
  showOverlay(`입출고 등록 중… (0 / ${toAdd.length})`);
  try{
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    let batch=db.batch(); let cnt=0; let done=0;
    for(const r of toAdd){
      const mRef=db.collection('movements').doc();
      const mData={cartId:r.cartId,date:r.date,type:'반출 대기(사내)',from:'',to:'인텍',qty:1,who:'오명진 팀장',memo:r.memo||'',createdAt:ts};
      batch.set(mRef,mData);
      // 대차 상태 → 점검대기로 동기화
      batch.update(db.collection('carts').doc(r.cartId),{status:'점검대기',updatedAt:ts});
      MOVEMENTS.push({id:mRef.id,...mData});
      if(CARTS[r.cartId]) CARTS[r.cartId].status='점검대기';
      cnt+=2;
      if(cnt>=498){ await batch.commit(); done+=cnt/2; batch=db.batch(); cnt=0; showOverlay(`입출고 등록 중… (${done} / ${toAdd.length})`); }
    }
    if(cnt>0) await batch.commit();
    MOVEMENTS.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    sendTeamsAlert(toAdd.map(r=>r.cartId), toAdd[0]?.date||'', toAdd.map(r=>r.memo||'').filter(Boolean).join(' / ')||'일괄 등록');
    hideOverlay(); setSyncStatus('저장됨 ✅');
    alert(`입출고 자동 등록 완료!\n${toAdd.length}건 등록됨 (유형: 반출 대기(사내) · 도착지: 인텍)`);
    if(curPage==='move') renderMove();
  } catch(e){ hideOverlay(); alert('오류: '+e.message); }
}

const ADMIN_PIN='103518';

  const v=prompt('🔒 관리자 비밀번호를 입력하세요');
  if(v===ADMIN_PIN){ _authed=true; setTimeout(()=>{ _authed=false; },30*60*1000); return true; }

async function deleteInsp(id){
  if(!checkAdmin()) return;
  if(!confirm('이 점검 기록을 삭제하시겠습니까?')) return;
  try{
    await db.collection('inspections').doc(id).delete();
    INSPECTIONS=INSPECTIONS.filter(i=>i.id!==id);
    setSyncStatus('삭제됨');
    renderInsp();
    renderDash();
  } catch(e){ alert('삭제 오류: '+e.message); }
}

function closeFollowUp(){
  followUpModalActive=false;
  followUpPhotos=[];
  closeModal('followUpModal');
}

function onFuReplaceChange(checked){
  const wrap=document.getElementById('fu_replace_wrap');
  const lbl=document.getElementById('fu_replace_lbl');
  if(wrap) wrap.style.borderColor=checked?'var(--blue)':'var(--bd)';
  if(lbl){ lbl.textContent=checked?'— 완료':'— 미완료'; lbl.style.color=checked?'var(--blue)':'var(--mut)'; }
  // 하나 누르면 둘 다 체크
  if(checked){
    const doneChk=document.getElementById('fu_done');
    if(doneChk&&!doneChk.checked){ doneChk.checked=true; onFuDoneChange(true); }
  }
}
function onFuDoneChange(checked){
  const wrap=document.getElementById('fu_done_wrap');
  const lbl=document.getElementById('fu_done_lbl');
  if(wrap){ wrap.style.borderColor=checked?'var(--ok)':'var(--bd)'; wrap.style.background=checked?'var(--okbg)':''; }
  if(lbl){ lbl.textContent=checked?'— 완료':'— 미완료'; lbl.style.color=checked?'var(--ok)':'var(--mut)'; }
  // 하나 누르면 둘 다 체크
  if(checked){
    const replChk=document.getElementById('fu_replace');
    if(replChk&&!replChk.checked){ replChk.checked=true; onFuReplaceChange(true); }
  }
}

async function saveFollowUp(id){
  const r=INSPECTIONS.find(i=>i.id===id); if(!r) return;
  const done=document.getElementById('fu_done')?.checked||false;
  const replaced=document.getElementById('fu_replace')?.checked||false;
  const memo=document.getElementById('fu_memo')?.value.trim()||'';
  // 결과 재계산 — 교체완료+점검완료 또는 전항목 정상이면 OK
  const checks=r.checks||{};
  const allNormal=(checks.wheels==='정상'&&checks.frame==='정상'&&checks.shoba==='정상'&&checks.fixtures==='정상'&&checks.clean==='청결');
  const result=(allNormal||(done&&replaced))?'OK':'NG';
  // 사진: 기존 + 새로 추가된 사진 합치기
  const allPhotos=[...(r.photos||[]),...followUpPhotos];
  try{
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('inspections').doc(id).update({done,replaced,result,memo,photos:allPhotos,updatedAt:ts});
    // 대차 상태 자동 반영
    const ns=result==='OK'?'정상운용':'점검대기';
    if(CARTS[r.cartId]){
      await db.collection('carts').doc(r.cartId).update({status:ns,updatedAt:ts});
      CARTS[r.cartId].status=ns;
    }
    // 메모리 즉시 반영
    r.done=done; r.replaced=replaced; r.result=result; r.memo=memo; r.photos=allPhotos;
    closeFollowUp();
    setSyncStatus('저장됨 ✅');
    alert(`후속 조치 저장 완료!\n결과: ${result}${result==='OK'?' → 대차 상태: 정상운용':''}`);
    renderInsp();
    renderDash();
  } catch(e){ alert('저장 오류: '+e.message); }
}

async function saveMove(){
  const cartId=val('mv_cart'); const date=val('mv_date');
  if(!cartId){ alert('대차를 선택하세요'); return; }
  const to=val('mv_to');
  const data={cartId,date,type:val('mv_type'),from:'',to,qty:parseInt(document.getElementById('mv_qty').value)||1,who:val('mv_who'),memo:val('mv_memo'),createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  try{
    const ref=await db.collection('movements').add(data);
    MOVEMENTS.unshift({id:ref.id,...data});
    // 위치 자동 갱신
    if(to && CARTS[cartId]){
      await db.collection('carts').doc(cartId).update({location:to,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      CARTS[cartId].location=to;
    }
    setSyncStatus('저장됨 ✅');
    alert('입출고 저장 완료!');
    renderMove();
  } catch(e){ alert('저장 오류: '+e.message); }
}

function buildMoveHist(){
  const rows=MOVEMENTS.slice(0,100).map(r=>{
    const isWait=r.type==='반출 대기(사내)'||r.type==='입고 대기(사내)'||r.type==='입고 대기';
    let typeBadge;
    if(r.type==='입고') typeBadge='st-ok';
    else if(r.type==='출고') typeBadge='st-ng';
    else if(isWait) typeBadge='st-warn';
    else if(r.type==='수리완료') typeBadge='st-ok';
    else typeBadge='st-blue';
    const dispType=isWait?'반출 대기(사내)':r.type;
    const repairBtn=isWait
      ?`<button class="btn sm" style="background:var(--okbg);color:var(--ok);border-color:var(--ok)" onclick="repairMove('${r.id}','${r.cartId}')">✅ 수리완료</button>`
      :'';
    return `<tr>
    <td>${r.date}</td>
    <td><b>${r.cartId}</b></td>
    <td><span class="badge ${typeBadge}">${dispType}</span></td>
    <td>${r.to||'—'}</td>
    <td>${r.qty||1}</td>
    <td>${r.who||'—'}</td>
    <td style="color:var(--mut);font-size:12px">${r.memo||'—'}</td>
    <td>${repairBtn}</td>
  </tr>`;
  }).join('');
  const delCount=MOVEMENTS.filter(r=>!['반출 대기(사내)','입고 대기(사내)','입고 대기'].includes(r.type)&&r.type!=='수리완료').length;
  return `
  <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
    ${delCount>0?`<button class="btn sm danger" onclick="clearOtherMoves()">🗑 반출 대기 외 ${delCount}건 삭제</button>`:''}
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>날짜</th><th>대차</th><th>유형</th><th>도착지</th><th>수량</th><th>담당자</th><th>메모</th><th>조작</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="8"><div class="empty">입출고 기록 없음</div></td></tr>'}</tbody>
  </table></div>`;
}

async function clearOtherMoves(){
  const KEEP=['반출 대기(사내)','입고 대기(사내)','입고 대기','수리완료'];
  const toDel=MOVEMENTS.filter(r=>!KEEP.includes(r.type));
  if(!toDel.length){ alert('삭제할 항목이 없습니다.'); return; }
  if(!confirm(`반출 대기(사내) · 수리완료 제외\n나머지 ${toDel.length}건을 삭제하시겠습니까?\n\n⚠️ 복구 불가`)) return;
  showOverlay(`삭제 중… (0 / ${toDel.length})`);
  try{
    let batch=db.batch(); let cnt=0; let done=0;
    for(const m of toDel){
      batch.delete(db.collection('movements').doc(m.id));
      if(++cnt>=499){ await batch.commit(); done+=cnt; batch=db.batch(); cnt=0; showOverlay(`삭제 중… (${done} / ${toDel.length})`); }
    }
    if(cnt>0) await batch.commit();
    const delIds=new Set(toDel.map(m=>m.id));
    MOVEMENTS=MOVEMENTS.filter(m=>!delIds.has(m.id));
    hideOverlay(); setSyncStatus('삭제 완료 ✅');
    alert(`${toDel.length}건 삭제 완료`);
    renderMove();
  } catch(e){ hideOverlay(); alert('오류: '+e.message); }
}

async function repairMove(id, cartId){
  if(!confirm(`대차 ${cartId}\n수리 완료 처리하시겠습니까?\n\n유형이 "수리완료"로 변경되고\n대차 상태가 정상운용으로 복구됩니다.`)) return;
  try{
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('movements').doc(id).update({type:'수리완료',repairDate:today(),updatedAt:ts});
    if(CARTS[cartId]){
      await db.collection('carts').doc(cartId).update({status:'정상운용',updatedAt:ts});
      CARTS[cartId].status='정상운용';
    }
    const m=MOVEMENTS.find(m=>m.id===id);
    if(m){ m.type='수리완료'; m.repairDate=today(); }
    setSyncStatus('저장됨 ✅');
    alert(`수리완료 처리 완료!\n대차 ${cartId} → 정상운용으로 복구됨`);
    renderMove();
    if(curPage==='dash') renderDash();
    if(curPage==='carts') renderCarts();
  } catch(e){ alert('오류: '+e.message); }
}

// 구버전 유형명 → "반출 대기(사내)" 자동 통일 (백그라운드 조용히 실행)
async function migrateMovTypes(){
  const OLD=['입고 대기(사내)','입고 대기'];
  const toFix=MOVEMENTS.filter(m=>OLD.includes(m.type));
  if(!toFix.length) return;
  try{
    let batch=db.batch(); let cnt=0;
    for(const m of toFix){
      batch.update(db.collection('movements').doc(m.id),{type:'반출 대기(사내)'});
      m.type='반출 대기(사내)';
      if(++cnt>=499){ await batch.commit(); batch=db.batch(); cnt=0; }
    }
    if(cnt>0) await batch.commit();
    renderMove();
  } catch(e){ console.warn('migrateMovTypes 오류:', e); }
}

// 반출 대기(사내) 중 대차 상태가 점검대기 아닌 것 → 점검대기로 강제 동기화
async function syncWaitingCartStatus(){
  // 수리완료 처리된 대차는 제외
  const repairedIds=new Set(MOVEMENTS.filter(m=>m.type==='수리완료').map(m=>m.cartId));
  const waitIds=[...new Set(
    MOVEMENTS.filter(m=>m.type==='반출 대기(사내)'&&!repairedIds.has(m.cartId)).map(m=>m.cartId)
  )];
  const toFix=waitIds.filter(id=>CARTS[id]&&CARTS[id].status!=='점검대기'&&CARTS[id].status!=='수리중');
  if(!toFix.length) return;
  try{
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    let batch=db.batch(); let cnt=0;
    for(const id of toFix){
      batch.update(db.collection('carts').doc(id),{status:'점검대기',updatedAt:ts});
      CARTS[id].status='점검대기';
      if(++cnt>=499){ await batch.commit(); batch=db.batch(); cnt=0; }
    }
    if(cnt>0) await batch.commit();
    renderDash(); // 메인 카운트 갱신
    if(curPage==='carts') renderCarts();
  } catch(e){ console.warn('syncWaitingCartStatus 오류:', e); }
}

async function reseedCarts(){
  if(!confirm(`기존 대차를 전부 삭제하고 다시 등록하시겠습니까?\n\n※ 점검/입출고 기록은 유지됩니다`)) return;
  showOverlay('기존 대차 삭제 중…');
  // 기존 대차 전부 삭제 (배치)
  const allIds = Object.keys(CARTS);
  let batch = db.batch(); let cnt=0;
  for(const id of allIds){
    batch.delete(db.collection('carts').doc(id));
    cnt++;
    if(cnt===499){ await batch.commit(); batch=db.batch(); cnt=0; }
  }
  if(cnt>0) await batch.commit();
  CARTS={};
  // 새 형식으로 재등록
  await seedCarts(true);
}

async function seedCarts(force){
  if(!force && Object.keys(CARTS).length >= SEED_TOTAL){
    alert('이미 대차가 등록되어 있습니다.\n번호 형식을 바꾸려면 "재등록" 버튼을 사용하세요.');
    return;
  }
  if(!force && !confirm(`대차 ${SEED_TOTAL}대를 일괄 등록하시겠습니까?\n\n`+
    SEED_GROUPS.map(g=>`${g.name} ${g.count}대`).join('\n'))){
    return;
  }
  showOverlay('대차 등록 중… (0 / '+SEED_TOTAL+')');
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  let done=0;
  // Firestore 배치: 한 번에 최대 500건
  let batch = db.batch();
  let batchCount = 0;
  for(const g of SEED_GROUPS){
    for(let i=1;i<=g.count;i++){
      const id = `${g.prefix}-${String(i).padStart(3,'0')}`;
      const ref = db.collection('carts').doc(id);
      batch.set(ref, {
        id, name:g.name, location:g.location,
        status:'정상운용', memo:'',
        createdAt:ts, updatedAt:ts
      });
      batchCount++;
      if(batchCount===499){
        await batch.commit();
        done+=batchCount; batchCount=0;
        batch=db.batch();
        showOverlay(`대차 등록 중… (${done} / ${SEED_TOTAL})`);
      }
    }
  }
  if(batchCount>0) await batch.commit();
  await loadAll();
  hideOverlay();
  setSyncStatus('초기 등록 완료 ✅');
  alert(`대차 ${SEED_TOTAL}대 등록 완료!`);
  renderCarts();
  go('carts');
}

/* ===== 초기화 ===== */
window.addEventListener('DOMContentLoaded', async ()=>{
  if(!fbInit()) return;
  hideOverlay();
  setSyncStatus('동기화 중…'); // render() 전에 먼저 상태 표시
  try{ render('dash'); }
  catch(e){
    console.error('render 오류:', e);
    document.getElementById('pg-dash').innerHTML=
      '<div style="padding:28px;color:#ef4444;font-size:15px">⚠️ 화면 로드 오류<br><small style="font-weight:400;color:#9ca3af">'+e.message+'</small><br><br><button class="btn pri" onclick="location.reload()">🔄 새로고침</button></div>';
  }
  try{
    await loadAll();
    setSyncStatus('동기화 완료 ✅');
    try{ render(curPage); }catch(e2){ console.error('render2 오류:', e2); }
    if(db) migrateMovTypes(); // 구버전 유형명 자동 통일
    if(db) syncWaitingCartStatus(); // 반출 대기 대차 상태 점검대기 동기화
  } catch(e){
    setSyncStatus('⚠️ 로드 실패 — 새로고침 해주세요');
    console.error('loadAll 오류:', e);
  }
});
</script>
